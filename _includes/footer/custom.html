<!-- Open external websites in a new tab while keeping site navigation in place. -->
<script>
  document.querySelectorAll("a[href]").forEach(function (link) {
    var href = link.getAttribute("href");

    if (!href || href.charAt(0) === "#" || /^(mailto|tel|javascript):/i.test(href)) {
      return;
    }

    try {
      var destination = new URL(href, window.location.href);
      var isWebLink = destination.protocol === "http:" || destination.protocol === "https:";

      if (isWebLink && destination.origin !== window.location.origin) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      }
    } catch (error) {
      /* Leave malformed or unsupported links unchanged. */
    }
  });
</script>
